name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          # Plugins aren't linked by the app, so name them for macdeployqt to
          # bundle their Qt dependencies (Qt Network for Plex) and fix paths.
          plugins=()
          for p in build/NewAmp.app/Contents/PlugIns/newamp/*; do plugins+=("-executable=$p"); done
          macdeployqt build/NewAmp.app -dmg "${plugins[@]}"
          mv build/NewAmp.dmg NewAmp-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: NewAmp-macOS
          path: NewAmp-macOS.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
