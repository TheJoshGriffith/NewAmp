name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: |
          # Failing test lines also become annotations, which are readable
          # from the API without downloading the whole log.
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || {
            grep -E 'FAIL!|Loc: |QWARN|QDEBUG|Totals:|Test #.*\*\*\*' ctest.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Package
        run: |
          # Plugins aren't linked by the app, so name them for macdeployqt to
          # bundle their Qt dependencies (Qt Network for Plex) and fix paths.
          plugins=()
          for p in build/NewAmp.app/Contents/PlugIns/newamp/*; do plugins+=("-executable=$p"); done
          macdeployqt build/NewAmp.app "${plugins[@]}"
          # macdeployqt rewrites library paths, which breaks the signatures
          # Apple Silicon requires, so re-sign everything ad hoc, inside out.
          find build/NewAmp.app/Contents/PlugIns -type f -print0 | xargs -0 codesign --force --sign -
          codesign --force --deep --sign - build/NewAmp.app
          codesign --verify --deep --strict --verbose=2 build/NewAmp.app

      - name: Launch check
        run: |
          # The app must survive startup, which is where a bad signature kills it.
          build/NewAmp.app/Contents/MacOS/NewAmp &
          pid=$!
          sleep 8
          kill -0 $pid
          kill $pid

      - name: Create disk image
        run: hdiutil create -volname NewAmp -srcfolder build/NewAmp.app -ov -format UDZO NewAmp-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: NewAmp-macOS
          path: NewAmp-macOS.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        shell: bash
        run: |
          # Failing test lines also become annotations, which are readable
          # from the API without downloading the whole log.
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || {
            grep -E 'FAIL!|Loc: |QWARN|QDEBUG|Totals:|Test #.*\*\*\*' ctest.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
